						// else if (cameras.type == 3) {

						// 			'</div>' +
						// 		'</li>'
						// };
						
					//添加至ul中
					$("#NVRCamera_camera_message").html($liNode);
					mui('.mui-switch')['switch']();
	
					//摄像机类型回显
						for (let cameraIndex in cameras) {
							if (cameraIndex == 'type') {
								switch(cameras.type){
									case 1:cameras.type = 'IPC';break;
									case 2:cameras.type = 'UVC';break;
									case 3:cameras.type = 'AHD';break
								};
							};
							if (cameraIndex == 'title') {
								if (cameras.title == 'xxx') {
									cameras.title = "";
								}
							};
							$("#NVRCamera_camera_" + cameraIndex).val(cameras[cameraIndex]);
						}
					
					//状态信息展示
					var enableDiv = document.getElementById("NVRCamera_camera_enable");
					if (cameras.enable == true) {
						enableDiv.classList.add('mui-active');
					};
					var recordEnableDiv = document.getElementById("NVRCamera_camera_recordEnable");
					if (cameras.recordEnable == true) {
						recordEnableDiv.classList.add('mui-active');
					};
					var showTitleDiv = document.getElementById("NVRCamera_camera_showTitle");
					if (cameras.showTitle == true) {
						showTitleDiv.classList.add('mui-active');
						$("#NVRCamera_camera_title_div").show();
					} else {
						$("#NVRCamera_camera_title_div").hide();
					};
					var subStreamDiv = document.getElementById("NVRCamera_camera_subStream");
					if (cameras.subStream == true) {
						subStreamDiv.classList.add('mui-active');
						$("NVRCamera_camera_subStream_div").show();
					} else {
						$("#NVRCamera_camera_subStream_div").hide();
					};
					
					if (cameras.type == 'UVC' || cameras.type == 'AHD' ) {
						//展示或隐藏摄像机名称
						document.getElementById('NVRCamera_camera_showTitle').addEventListener("toggle", function(event) {
							if (event.detail.isActive) {
								document.getElementById('NVRCamera_camera_title_div').style.display = '';
							} else {
								document.getElementById('NVRCamera_camera_title_div').style.display = 'none';
							}
						});
						
						//展示或隐藏子码流信息
						document.getElementById('NVRCamera_camera_subStream').addEventListener("toggle", function(event) {
							if (event.detail.isActive) {
								document.getElementById('NVRCamera_camera_subStream_div').style.display = '';
							} else {
								document.getElementById('NVRCamera_camera_subStream_div').style.display = 'none';
							}
						});
					};
					
					//获取表单数据
					document.getElementById('saveBtn').addEventListener('tap',function(){
						var editCamera = $('#NVRCamera_camera_editForm').serializeObject();
						var enableIsActivity = document.getElementById("NVRCamera_camera_enable").classList.contains("mui-active");
						var recordEnableIsActivity = document.getElementById("NVRCamera_camera_recordEnable").classList.contains("mui-active");
						switch(editCamera.type){
							case 'IPC':editCamera.type = '1';break;
							case 'UVC':editCamera.type = '2';break;
							case 'AHD':editCamera.type = '3';break
						};
						if (cameras.title == '') {
							cameras.title = 'xxx';
						};
						
						//是否启用赋值
						if (enableIsActivity) {
							editCamera.enable = true;
						}else{
							editCamera.enable = 'false';
						};
						
						//是否保存录像赋值
						if (recordEnableIsActivity) {
							editCamera.recordEnable = true;
						}else{
							editCamera.recordEnable = 'false';
						};
						
						//当类型为2或3时，给开关对应的字段赋值
						if (editCamera.type == '2' || editCamera.type == '3') {
							var showTitleIsActivity = document.getElementById("NVRCamera_camera_showTitle").classList.contains("mui-active");
							var subStreamEnableIsActivity = document.getElementById("NVRCamera_camera_subStream").classList.contains("mui-active");
							
							//是否显示名称
							if (showTitleIsActivity) {
								editCamera.showTitle = true;
							}else{
								editCamera.showTitle = 'false';
							};
							
							//是否支持子码流
							if (subStreamEnableIsActivity) {
								editCamera.subStream = true;
							}else{
								editCamera.subStream = 'false';
							}
						};
						
						var editFormCamera = JSON.stringify(editCamera);
							//将编辑后的摄像机信息传递给摄像头列表
							//进行预加载
							var prPage = mui.preload({url:'NVRCameras.html',id:'NVRCameras.html'});
							mui.fire(prPage,'editCamera',{editData:editFormCamera});
							mui.openWindow({
								url:'NVRCameras.html',
								id:'NVRCameras.html'
							});
					});
					
					//遍历form表单，获取表单中的数据
					$.fn.serializeObject = function() {
						var o = {};
						var a = this.serializeArray();
						$.each(a, function() {
							if (o[this.name]) {
								if (!o[this.name].push) {
									o[this.name] = [o[this.name]];
								}
								o[this.name].push(this.value || '');
							} else {
								o[this.name] = this.value || '';
							}
						});
						return o;
					};
			})
		</script>

</html>
