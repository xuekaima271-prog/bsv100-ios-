<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<title>摄像头列表</title>
		<script src="js/mui.min.js"></script>
		<link href="css/mui.min.css" rel="stylesheet" />
		<link href="css/app.css" rel="stylesheet" />

		<style type="text/css">
			.mui-title {
				font-weight: bold;
				font-size: 20px;
			}

			.mui-table-view-cell {
				height: 50px;
			}
			
			.mui-btn-save {
				margin-top: 20px;
				width: 40%;
				height: 40px;
			}

			.mui-table-view {
				width: 99%;
				margin: 0px 0.5% 0px 0.5%;
			}

			.mui-a-add {
				float: right;
				font-size: 30px;
			}
			
			.mui-btn-div-inco{
				width: 5%;
				float: right;
				margin-right: 10px;
			}
			.div-green{
				height: 10px;
				width: 10px;
				border-radius: 5px;
				background-color: limegreen;
				display: inline-block;
				margin-right: 5px;
			}
			.div-grey{
				height: 10px;
				width: 10px;
				border-radius: 5px;
				background-color: gray;
				display: inline-block;
				margin-right: 5px;
			}
		</style>
	</head>
	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-icon mui-icon-arrowleft mui-pull-left" id="NVRCamera_cameras_save"></a>
			<a class="mui-title">摄像头列表</a>
			<!-- <a class="mui-icon mui-icon-plusempty mui-a-add" id="addCamera"></a> -->
		</header>
		<div class="mui-content">
			<ul id="NVRCamera_cameras_list" class="mui-table-view">
			</ul>
			<div class="addDiv">
				<img src="img/newAdd.png" style="width: 60px;height: 60px;" id="addCamera">
			</div>
		</div>

		<script src="js/jquery.min.js" type="text/javascript" charset="utf-8"></script>
		<script type="text/javascript" charset="utf-8">
			mui.init();
			mui.plusReady(function () {
				
					//接受来自主页面的传值
			    var self = plus.webview.currentWebview();
			    var oldCamera = self.cameras;
					
					var cameras = oldCamera;
					console.log(JSON.stringify(cameras))
					
					//初始化加载页面
					reload(cameras);
					
					//添加摄像头跳转页面
					document.getElementById('addCamera').addEventListener('tap',function(){
						mui.openWindow({
							url: 'addCamera.html',
							id:	'addCamera'
						})
					});
					
					//获得添加页面传过来的摄像头信息
					window.addEventListener('saveCamera',function(e){
						let newCamera = e.detail.data;
						cameras[cameras.length] = JSON.parse(newCamera);
						plus.webview.close('addCamera');
						reload(cameras);
						// console.log(JSON.stringify(cameras))
					});
					
					//获得编辑页面传过来的摄像头信息
					window.addEventListener('editCamera',function(e){
						let newEditCamera = e.detail.editData;
						let editC = JSON.parse(newEditCamera);
						for (let i = 0; i < cameras.length; i++) {
							if(cameras[i].id == editC.id){
								cameras[i] = editC;
							}
						}
						plus.webview.close('editCamera');
						reload(cameras);
					});
					
					//传值给主页面
					document.getElementById('NVRCamera_cameras_save').addEventListener('tap',function(){
						//页面传值给摄像头列表
						//进行预加载
						var prPage = mui.preload({url:'loadVstreamRecorder.html',id:'loadVstreamRecorder.html'});
						//console.log(JSON.stringify(cameras))
						mui.fire(prPage,'cameraList',{datas:JSON.stringify(cameras)});
						mui.openWindow({
							url:'loadVstreamRecorder.html',
							id:'loadVstreamRecorder.html'
						});
					});
					
			});
			
			//初始化页面
			function reload(cameras){
				let divtype;
				//	删除ul内的所有节点,避免数据重复
				$("#NVRCamera_cameras_list").html("");
				
				var $liNode = "";
				for (var i = 0; i < cameras.length; i++) {
					
					if (cameras[i].enable == true) {
						divtype = 'div-green'
					} else{
						divtype = 'div-grey'
					}
					
					//摄像机type数值转换成实际的类型显示
					let cameraTypeList = Number(cameras[i].type);
					switch(cameraTypeList){
						case 1:cameraTypeList = 'IPC';break;
						case 2:cameraTypeList = 'UVC';break;
						case 3:cameraTypeList = 'AHD';break
					}
					
					
					
					//动态创建节点
					$liNode +=
						'<li class="mui-table-view-cell">' +
							'<div class="mui-slider-right mui-disabled">' +
								'<a class="mui-btn mui-btn-green" editData='+JSON.stringify(cameras[i])+' id="editCamera' + cameras[i].id +'"> 编辑 </a>' +
								'<a class="mui-btn mui-btn-red" deleteData='+ i +' id="deleteCamera' + cameras[i].id +'"> 删除 </a>' +
							'</div>' +
							'<div class="mui-slider-handle mui-table" showData='+JSON.stringify(cameras[i])+' id="' + cameras[i].id +'">' +
								'<div class="mui-table-cell" style="width: 80%;"><div class="'+divtype+'"></div>摄像头编号：' + cameras[i].id + '（' + cameraTypeList + '）</div>' +
								'<div class="mui-btn-div-inco" style="width: 20%;">' +
									'<a class="mui-icon mui-icon-arrowright"></a>' +
								'</div>' +
							'</div>' +
						'</li>';
				}
				
				//添加至ul中
				$("#NVRCamera_cameras_list").html($liNode);
				
				for (var i = 0; i < cameras.length; i++) {
					
					//页面跳转至编辑页面
						document.getElementById('editCamera' + cameras[i].id).addEventListener('tap', function() {
							//console.log($(this).attr("editData"))
							mui.openWindow({
								url: 'editCamera.html',
								id : 'editCamera',
								extras:{
									editCamera:$(this).attr("editData")
								}
							});
						});
					
					//删除摄像头
					document.getElementById('deleteCamera' + cameras[i].id ).addEventListener('tap',function(){
						let deleteD = $(this).attr("deleteData");
						cameras.splice(deleteD,1);
						reload(cameras);
					});
					
					//页面跳转至展示页面
					document.getElementById(cameras[i].id).addEventListener('tap', function() {
						//console.log($(this).attr("showData"))
						mui.openWindow({
							url: 'NVRCamera.html',
							id : 'NVRCamera.html',
							extras:{
								camera:$(this).attr("showData")
							}
						})
					});
				};
			};
			
		</script>
	</body>
</html>
