			//重启设备，点击重启设备
			document.getElementById('loadReBoot').addEventListener('tap', function() {
				var btnArray = ['否', '是'];
				mui.confirm('是否确认重启，确认？', '提示', btnArray, function(e) {
					if (e.index == 1) {
						$('#my').show();
						// return
						mui.ajax({
							url: baseConfigIp + baseConfigPort + 'reboot.cgi',
							type: 'post',
							timeout: 10000 ,
							success: function(data) {
								setTimeout(function(){
									if(JSON.parse(data).resultCode == 0){
										mui.alert('重启成功')
									}else{
										mui.alert('重启失败')
									}
									$('#my').hide();
								},20000)
							},
							error : function(xhr,type,errorThrown){ //请求完成后最终执行参数
				　　　　if(type == 'timeout'){//超时,status还有success,error等值的情况
				　　　　　	mui.alert("请求超时");
				　　　　}else {
									mui.alert('请求失败：' + type + '\n err:' + errorThrown);
								}
								$('#my').hide();
							}
						})
					}
				})
			})
			
						
			//恢复出厂设置
			document.getElementById('loadReset').addEventListener('tap',function(){
				var btnArray = ['否', '是'];
				mui.confirm('是否确认恢复出厂设置，确认？', '提示', btnArray, function(e){
					if (e.index == 1) {
						mui.ajax({
									url: baseConfigIp + baseConfigPort + 'loadVAITerminal_JT.cgi',
									type: 'get',
									dataType: 'json',
									success: function(data) {
										var configData = data.config;
										for (var baseIndex in configData) {
											if(baseIndex == "jt808"){
												if(configData[baseIndex].authentication==''){
													$('#my').show();
															mui.ajax({
																url: baseConfigIp + baseConfigPort + 'resetFactory.cgi',
																type: 'post',
																timeout: 10000,
																success: function(data) {
																	setTimeout(function(){
																		if(JSON.parse(data).resultCode == 0){
																			mui.alert('恢复出厂设置成功')
																		}else{
																			mui.alert('恢复出厂设置失败')
																		}
																		$('#my').hide();
																	},20000)
																},
																error : function(xhr,type,errorThrown){ //请求完成后最终执行参数
													　　　　if(type == 'timeout'){//超时,status还有success,error等值的情况
													　　　　　	mui.alert("请求超时");
													　　　　}else {
																		mui.alert('请求失败：' + type + '\n err:' + errorThrown);
																	}
																	$('#my').hide();
																}
															})
												}else{
														mui.alert("请先注销当前终端设备");
												}
											}
											
										}
										
									},
								})
					}
				})
			})
		</script>
	</body>
