<!doctype html>
<html>
   <head>
	<meta charset="UTF-8">
	<title></title>
	<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <link href="../../css/mui.min.css" rel="stylesheet"/>
    <script src="../../js/mui.min.js"></script>
    <script src="../../js/jquery.min.js" type="text/javascript" charset="utf-8"></script>
	<style type="text/css">
		#bcid{
			width: 100%;
			height: 100%;
			background: #000000; 
		}
		html, body ,div{
			height:100%;
			width: 100%;
		}
		.fbt{
			color: #0E76E1;
			width: 100%;
			background-color: #ffffff;
			float: left; 
			line-height: 44px;
			text-align: center;
		}
	</style>
   </head>
  <body>
		<div id="bcid">   
			 <!--盛放扫描控件的div-->  		
		</div>
		<script type="text/javascript">
			//上级页面传来的参数对象
			var openerEventName;
			var scan = null;//扫描对象
			mui.plusReady(function () {
				// 初始化
				mui.init();
				$("#bcid").html("")
				plus.webview.currentWebview().append(scan);
				startRecognize();
				//获取上级页面传来的参数对象
				openerEventName = plus.webview.currentWebview().eventName;
			});
			
			/**
			 * 创建扫码控件设置控件样式
			 */
			function startRecognize(){
				try{
					//自定义的扫描控件样式
					var styles = {frameColor: "#29E52C",scanbarColor: "#29E52C",background: ""}
					//扫描控件构造
					scan = new plus.barcode.Barcode('bcid',[0],styles);
					//定义扫描回调方法
					scan.onmarked = onmarked; 
					scan.onerror = onerror;
					scan.start();
					//打开关闭闪光灯处理
					var flag = false;
				 
				}catch(e){
						
				}
			};
			
			/**
			 * @param {Object} e
			 * 扫码失败后回调方法
			 */
			function onerror(e){
					mui.alert("扫码失败，请重试");
			};
			
			/**
			 * @param {Object} type 二维码类型
			 * @param {Object} result 扫码结果
			 * 扫码成功后回调方法
			 */
			function onmarked(type,result) {
				//获取上级页面对象
				let openner = plus.webview.currentWebview().opener();　
				//触发上级页面传来来的制定参数
				mui.fire(openner,openerEventName,{deviceID:result});
				mui.back();
			};	
				
			</script>
	</body>
</html>
