<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<title>推流详情</title>
		<script src="js/mui.min.js"></script>
		<link href="css/mui.min.css" rel="stylesheet" />

		<style type="text/css">
			/* .mui-input-group {
				width: 99%;
				margin: 10px 0.5% 0px 0.5%;
			} */

			.mui-button-div {
				height: 50px;
				margin-top: 5px;
			}

			.mui-button-bottom {
				height: 40px;
				bottom: 10px;
			}

			.mui-title {
				font-weight: bold;
				font-size: 20px;
			}
			
			.mui-switch{
				width: 85px;
			}
			
			.mui-readonly{
				pointer-events:none;
			}
			
		</style>
	</head>
	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-arrowleft mui-pull-left"></a>
			<a class="mui-title">推流信息</a>
		</header>
		<div class="mui-content">
			<form class="mui-input-group mui-readonly">
				<ul class="mui-table-view mui-input-group" id="streams_stream_message">
					
				</ul>
			</form>
		</div>

		<script src="js/jquery.min.js" type="text/javascript" charset="utf-8"></script>
		<script type="text/javascript" charset="utf-8">
			mui.init();
			mui.plusReady(function () {
				
				//接收来自主页面传来的摄像机列表
			    var self = plus.webview.currentWebview();
			    var subCamera = self.stream;
					var cameras = JSON.parse(subCamera);
					
					//删除ul内的所有节点,避免数据重复
					$("#streams_stream_message").html("");
					
					//根据接收到的摄像机数据，动态生成摄像机列表
					var $liNode = "";
							$liNode +=
								'<li class="mui-table-view-cell">' +
									'<div class="mui-input-row">' +
										'<label>编号</label>' +
										'<input type="text" class="mui-input-clear" name="id" id="streams_stream_id"/>' +
									'</div>' +
									'<div class="mui-input-row mui-right">' +
										'<label>是否启用</label>' +
										'<div class="mui-switch" id="streams_stream_enable" name="enable">'+
											'<div class="mui-switch-handle"></div>'+
										'</div>' +
									'</div>' +
									'<div class="mui-input-row">' +
										'<label>推流描述</label>' +
										'<input type="text" class="mui-input-clear" name="label" id="streams_stream_label"/>' +
									'</div>' +
									'<div class="mui-input-row">' +
										'<label>url地址</label>' +
									'</div>' +
									'<div class="mui-input-row" style="height: 60px">' +
										'<textarea type="text" class="mui-input-clear" name="url" id="streams_stream_url"/>' +
									'</div>' +
								'</li>';
						
					//添加至ul中
					$("#streams_stream_message").html($liNode);
					mui('.mui-switch')['switch']();
					
					//摄像机类型回显
					for (let cameraIndex in cameras) {
						$("#streams_stream_" + cameraIndex).val(cameras[cameraIndex]);
					};
					
					//是否启用回显
					var enableDiv = document.getElementById("streams_stream_enable");
					if (cameras.enable == true || cameras.enable == 'true') {
						mui("#streams_stream_enable").switch().toggle();
						enableDiv.classList.add('mui-active');
					}else {
						enableDiv.classList.remove('mui-active');
					}
					
			});
		</script>
	</body>
</html>
