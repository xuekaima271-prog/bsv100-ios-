<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<title></title>
		<script src="../js/mui.min.js"></script>
		<link href="../css/mui.min.css" rel="stylesheet" />

		<style type="text/css">
			.mui-btn-save { 
				width: 40%;
				height: 40px;
			}

			.mui-title {
				font-weight: bold;
				font-size: 20px;
			}

			.mui-table-view {
				border: solid 0.5px lightgrey;
			}

			.mui-table-view-cell-title {
				background-color: #F2F4F5;
				color: #666666;
			}

			.mui-table-view-cell {
				border-radius: 1px;
			}
			.mui-input-blackColor {
				background-color: #F2F4F5;
			}
		</style>
	</head>
	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-arrowleft mui-pull-left"></a>
			<a class="mui-title">UVMonitor配置</a>
		</header>
		<div class="mui-content">

    <form class="mui-input-group" id="loadUVMonitor_mqtt_form">
      <ul class="mui-table-view mui-input-group">
        <li class="mui-table-view-cell mui-table-view-cell-title">mqtt配置</li>
        <li class="mui-table-view-cell">
          <div class="mui-input-row">
            <label>通知主题</label>
            <input type="text" name="notifyTopic" id="loadUVMonitor_mqtt_notifyTopic" />
          </div>
          <div class="mui-input-row">
            <label>订阅主题</label>
            <input type="text" name="reportTopic" id="loadUVMonitor_mqtt_reportTopic" />
          </div>
        </li>
      </ul>
    </form>
    
    <form class="mui-input-group" id="loadUVMonitor_form">
      <ul class="mui-table-view mui-input-group">
        <li class="mui-table-view-cell mui-table-view-cell-title">UVMonitor配置</li>
        <li class="mui-table-view-cell">
          <div class="mui-input-row">
            <label>后备电源端口</label>
            <input type="text" name="backupPowerGpio" id="loadUVMonitor_form_backupPowerGpio" />
          </div>
          <div class="mui-input-row">
            <label>低电压检测端口</label>
            <input type="text" name="uvDetect" id="loadUVMonitor_form_uvDetect" />
          </div>
          <div class="mui-input-row">
            <label>低电压锁端口</label>
            <input type="text" name="uvLock" id="loadUVMonitor_form_uvLock" />
          </div>
          <div class="mui-input-row">
            <label>温度阈值</label>
            <input type="text" name="temperature" id="loadUVMonitor_form_temperature" />
          </div>
         <div class="mui-input-row">
           <label>是否检测低电压</label>
             <div class="mui-switch" id="loadUVMonitor_form_uvEnalbe" name="uvEnalbe">
              <input type="hidden"  name="uvEnalbe" id="loadUVMonitor_form_uvEnalbe_in">
              <div class="mui-switch-handle"></div>
             </div>
         </div>
          
        </li>
      </ul>
    </form>
    
    <form class="mui-input-group" id="loadCanProxy_mountList">
    	<ul class="mui-table-view mui-input-group">
    		<li class="mui-table-view-cell mui-table-view-cell-title">挂载列表</li>
    		<li class="mui-table-view-cell">
    			<a class="mui-navigate-right" id="mountList">查看列表</a>
    		</li>
    	</ul>
    </form>
    
    <form class="mui-input-group" id="loadUVMonitor_notifyList_form">
      <ul class="mui-table-view mui-input-group">
        <li class="mui-table-view-cell mui-table-view-cell-title">通知列表</li>
        <li class="mui-table-view-cell">
        	<a class="mui-navigate-right" id="notifyList">查看列表</a>
        </li>
      </ul>
    </form>
			
    <div class="mui-button-row" style="height: 40px;margin-top: 10px;">
      <span style="color: #007AFF;">应用参数保存后，需重启设备方能生效</span>
    </div>
    <div class="mui-button-row">
      <button type="button" class="mui-btn mui-btn-primary mui-btn-save" id="saveBtn" style="width: 80%;border-radius: 20px;">保存</button>
    </div>
		</div>

		<script src="../js/jquery.min.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/baseConfig.js" type="text/javascript" charset="utf-8"></script>
		<script type="text/javascript" charset="utf-8">
			mui.init();

			//请求的URL地址
			var baseConfigIp = configIp;
			
			//请求的端口号
			var baseConfigPort = configPort;
			
			// miniserver原来信息暂存
			var miniserverOtherDatas = {};
			
      // global原来信息暂存
			var globalOtherDatas = {};
      var appList = ''
      var notifyList;
      var mountListData;
			//发送请求获取全局配置的基本信息
			$.ajax({
				url: baseConfigIp + baseConfigPort + 'loadUVMonitor.cgi',
				type: 'get',
				dataType: 'json',
				success: function(data) {
					let configData = data.config;
					for (let baseIndex in configData) {
						if (baseIndex == "mqtt") {
							let mqttData = configData[baseIndex];
							for (let mqttIndex in mqttData) {
								 document.getElementById("loadUVMonitor_mqtt_" + mqttIndex).value = mqttData[mqttIndex];
							}
						} else if (baseIndex == "notifyList") {
                 notifyList = configData[baseIndex]
                 console.log('加载数据')
              console.log(JSON.stringify(notifyList))
            } else if (baseIndex != "mountList"){
              document.getElementById("loadUVMonitor_form_" + baseIndex).value = configData[baseIndex];
            } else {
              mountListData = configData[baseIndex]
            }
					}
          if (configData.uvEnalbe== "true" || configData.uvEnalbe == true) {
          	mui("#loadUVMonitor_form_uvEnalbe").switch().toggle();
          	$('#loadUVMonitor_form_uvEnalbe_in').val(true);								 
          } else {
          	$('#loadUVMonitor_form_uvEnalbe_in').val(false);
          }
				}
			});
		  
      //点击保存4g状态信息
		  document.getElementById('loadUVMonitor_form_uvEnalbe').addEventListener('tap', function() {
		  	let stateVal = $('#loadUVMonitor_form_uvEnalbe').val();
		  	if (stateVal == "true" || stateVal == true) {
		  		$('#loadUVMonitor_form_uvEnalbe_in').val(false);
		  	} else {
		  		$('#loadUVMonitor_form_uvEnalbe_in').val(true);
		  	}
		  });
      //跳转通知列表
      document.getElementById('notifyList').addEventListener('tap', function() {
      	mui.openWindow({
      		url: 'notifyList.html',
      		id: 'notifyList.html',
      		extras:{
      			notifyList:notifyList
      		}
      	});
      });
      
      //跳转挂载列表
      document.getElementById('mountList').addEventListener('tap', function() {
      	mui.openWindow({
      		url: 'mountList.html',
      		id: 'mountList.html',
      		extras:{
      			mountList: mountListData
      		}
      	});
      });
      
      //获得通知添加页面传过来的息
      window.addEventListener('saveList',function(e){
      	let listL = e.detail.datas;
      	notifyList = JSON.parse(listL);
        console.log(JSON.stringify(notifyList))
      });
      
      //获得挂载添加页面传过来的
      window.addEventListener('saveMountList',function(e){
      	let listL = e.detail.datas;
      	mountListData = JSON.parse(listL);
        console.log(JSON.stringify(mountListData))
      });
			
			
			//点击保存储存信息
			document.getElementById('saveBtn').addEventListener('tap', function() {
				var btnArray = ['否', '是'];
				mui.confirm('是否确认保存，确认？', '提示', btnArray, function(e) {
					if (e.index == 1) {
						// 获取消息总线表单数据
						var mqttForm = $('#loadUVMonitor_mqtt_form').serializeObject();
            var notifyListData = $('#loadUVMonitor_form').serializeObject();
            notifyListData.backupPowerGpio = Number(notifyListData.backupPowerGpio)
            notifyListData.temperature = Number(notifyListData.temperature)
            notifyListData.uvDetect = Number(notifyListData.uvDetect)
            notifyListData.uvLock = Number(notifyListData.uvLock)
            if(notifyListData.uvEnalbe == 'true'){
            	notifyListData.uvEnalbe = true
            }else{
            	notifyListData.uvEnalbe = false
            }
            // mountListData = JSON.parse(plus.storage.getItem('saveMountList'));
            var data = {
              mqtt: mqttForm,
              backupPowerGpio: notifyListData.backupPowerGpio,
              temperature: notifyListData.temperature,
              uvDetect: notifyListData.uvDetect,
              uvLock: notifyListData.uvLock,
              uvEnalbe: notifyListData.uvEnalbe,
              notifyList: notifyList,
              mountList: mountListData
            }
            console.log('保存数据')
            console.log(JSON.stringify(data))
						//将获取的数据组装成服务器接受的formdata格式
						var config = {
							config: JSON.stringify(data)
						}
						var formdata = new FormData();
						for (let index in config){
							formdata.append(index,config[index])
						}
						//将修改后的数据发送请求给服务器进行保存
						$.ajax({
							url: baseConfigIp + baseConfigPort + 'saveUVMonitor.cgi ',
							data: formdata,
							type: 'post',
							processData: false,
							contentType: false,
							success: function(data) {
								if(data.resultCode == 0){
                  mui.alert('保存成功')
								}else{
									mui.alert('保存失败，请重试')
								}
							}
						});
					}
				})
			});
			
			//遍历form表单，获取表单中的信息
			$.fn.serializeObject = function() {
				var o = {};
				var a = this.serializeArray();
				$.each(a, function() {
					if (o[this.name]) {
						if (!o[this.name].push) {
							o[this.name] = [o[this.name]];
						}
						o[this.name].push(this.value || '');
					} else {
						o[this.name] = this.value || '';
					}
				});
				return o;
			};
		</script>
		<script type="text/javascript">
			
		</script>
	</body>
</html>
